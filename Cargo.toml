[package]
name = "den"
version = "0.2.0"
edition = "2024"
description = "A project and session picker for Claude Code"
repository = "https://github.com/kinduff/den"
homepage = "https://github.com/kinduff/den"
readme = "README.md"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"

[dev-dependencies]
tempfile = "3.27.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
